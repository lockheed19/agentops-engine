[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentops-engine"
version = "0.1.0"
description = "Autonomous Distributed Incident Triage & Self-Healing Agent Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.1.0",
    "python-dotenv>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]